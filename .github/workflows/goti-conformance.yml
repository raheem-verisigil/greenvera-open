name: GOTI conformance

on:
  push:
    paths:
      - "open-spec/**"
      - "tools/goti_validate.py"
      - "tests/test_goti_conformance.py"
      - "requirements-dev.txt"
      - ".github/workflows/goti-conformance.yml"
  pull_request:
    paths:
      - "open-spec/**"
      - "tools/goti_validate.py"
      - "tests/test_goti_conformance.py"
      - "requirements-dev.txt"
      - ".github/workflows/goti-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate published examples
        run: python tools/goti_validate.py open-spec/examples
      - name: Run conformance tests
        run: python -m unittest discover -s tests -p "test_goti_conformance.py" -v
